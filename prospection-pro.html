<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clients & Prospection — Kanji Multi Services</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--or:#F26522;--bl:#1D3FBF;--mar:#14224A;--pap:#FBFAF7;--ln:#E2DED6;--vt:#0E7A4A;--rg:#C1272D;--jn:#C9A227;--ch:#3A3A3A;--gy:#8A8377;--wa:#25D366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--pap);font-family:Inter,system-ui,sans-serif;color:var(--ch)}
button{font-family:inherit;cursor:pointer;border:0}
input,select,textarea{font-family:inherit;font-size:14px}
.hide{display:none!important}
.mono{font-family:'JetBrains Mono',monospace}
h1,h2,h3,.cd{font-family:'Barlow Condensed',sans-serif}
.bar{background:var(--mar);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.logo{height:44px;width:44px;border-radius:50%;background:#fff;border:2px solid var(--or);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--mar);font-weight:800;font-family:'Barlow Condensed';font-size:19px;flex:none}
.bar .nom{font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1;font-family:'Barlow Condensed'}
.bar .sous{font-size:10px;letter-spacing:2.4px;color:var(--or);font-weight:600}
.bar .sp{flex:1}
.bar .sv{font-size:11px;color:#aeb8d8;text-align:right}
.tabs{display:flex;gap:4px;overflow:auto;background:var(--mar);padding:0 10px 10px;position:sticky;top:64px;z-index:39}
.tabs button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#dde3f3;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--or);border-color:var(--or);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:18px 14px 70px}
.carte{background:#fff;border:1px solid var(--ln);border-radius:9px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.carte h2{font-size:23px;letter-spacing:.5px;color:var(--mar);margin:0 0 3px}
.carte .st{font-size:13px;color:var(--gy);margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:11px;letter-spacing:1.1px;color:var(--gy);font-weight:600;margin:10px 0 4px;text-transform:uppercase}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--ch)}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--or)}
textarea{min-height:76px;resize:vertical}
.btn{border-radius:6px;padding:10px 16px;font-size:14px;font-weight:600;color:#fff;background:var(--or);display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.05)}
.btn.bl{background:var(--bl)}.btn.nv{background:var(--mar)}.btn.wa{background:var(--wa)}.btn.vt{background:var(--vt)}
.btn.o{background:#fff;color:var(--mar);border:1px solid var(--ln)}
.btn.rg{background:#fff;color:var(--rg);border:1px solid #E8C4C6}
.btn.sm{padding:6px 11px;font-size:12.5px}
a.btn{text-decoration:none}
.h2t{margin:0;font-family:'Barlow Condensed';color:var(--mar);font-size:23px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--ln);border-radius:9px;padding:15px;border-top:4px solid var(--bl)}
.stat:nth-child(2){border-top-color:var(--vt)}.stat:nth-child(3){border-top-color:var(--or)}.stat:nth-child(4){border-top-color:var(--jn)}.stat:nth-child(5){border-top-color:var(--mar)}
.stat .lb{font-size:10px;letter-spacing:1.3px;color:var(--gy);font-weight:600;margin-bottom:6px;text-transform:uppercase}
.stat .vl{font-family:'JetBrains Mono';font-size:26px;font-weight:700;color:var(--mar)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10px;letter-spacing:1.1px;color:var(--gy);font-weight:600;padding:9px 10px;border-bottom:2px solid var(--ln);text-transform:uppercase}
td{padding:10px;border-bottom:1px solid #F0EDE7;vertical-align:middle}
#cl tr:hover td{background:#FDFBF8;cursor:pointer}
.vide{text-align:center;padding:30px;color:var(--gy)}
.pst{font-size:10px;letter-spacing:.5px;font-weight:700;padding:3px 9px;border-radius:11px;white-space:nowrap;display:inline-block}
.prio{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.pr-H{background:#FDE7E9;color:var(--rg)}.pr-N{background:#eef;color:var(--bl)}.pr-B{background:#eee;color:var(--gy)}
.bienbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.bien{background:#fff;border:1px solid var(--ln);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.bien .ph{height:150px;background:#E9E5DD center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gy);font-size:13px}
.bien .cp{padding:13px;flex:1}
.bien .rf{font-family:'JetBrains Mono';font-weight:700;color:var(--or);font-size:12px}
.bien .tt{font-weight:700;color:var(--mar);margin:3px 0 6px;font-size:17px;font-family:'Barlow Condensed';letter-spacing:.3px}
.bien .pr{font-family:'JetBrains Mono';font-weight:700;font-size:17px;color:var(--mar)}
.bien .mt{font-size:12.5px;color:var(--gy);margin-top:4px}
.bien .ac{display:flex;gap:6px;padding:0 13px 13px;flex-wrap:wrap}
.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search input{flex:1 1 100%}
.search select{flex:1 1 30%;min-width:130px}
.sect{font-family:'Barlow Condensed';font-size:18px;color:var(--mar);margin:16px 0 8px;letter-spacing:.3px}
.muted{text-align:center;color:var(--gy);padding:24px}
.ov{position:fixed;inset:0;background:rgba(20,34,74,.55);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:20px 12px;overflow:auto}
.modal{background:#fff;border-radius:11px;width:100%;max-width:700px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35);margin:auto}
.modal .tt{background:var(--mar);color:#fff;padding:13px 18px;display:flex;align-items:center;gap:10px}
.modal .tt h3{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
.modal .tt button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;padding:5px 11px}
.modal .cp{padding:18px}
.modal .pied{padding:0 18px 18px;display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--mar);color:#fff;padding:12px 18px;border-radius:9px;font-weight:600;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.banner{background:#FFF7E6;border:1px solid var(--jn);border-left:4px solid var(--jn);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:#8a6d16}
.info{background:#EEF2FF;border:1px solid #C9D3F5;border-left:4px solid var(--bl);border-radius:6px;padding:10px 13px;font-size:13px;color:#2a3a7a;margin:10px 0}
.chan{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.chan .btn{justify-content:center}
.memb{display:flex;align-items:center;gap:12px;border-bottom:1px solid #F0EDE7;padding:10px 0}
.av{width:38px;height:38px;border-radius:50%;background:var(--mar);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,var(--mar),#0b1430);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px}
#lock .bx{background:#fff;border-radius:12px;padding:30px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lock .logo{width:64px;height:64px;margin:0 auto 12px}
#lock input{text-align:center;letter-spacing:7px;font-size:22px;font-weight:700}
@media(max-width:700px){ th.hcol,td.hcol{display:none} .carte{padding:14px} .bar .sv{display:none} }

/* ---------- impression ---------- */
#print{display:none}
#print,#print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  body.printing > *:not(#print){display:none!important}
  body.printing #print{display:block}
  #print{font-family:Inter,Arial,sans-serif;color:#222;font-size:11.5pt}
  .pg{page-break-after:always}
  .pg:last-child{page-break-after:auto}
  .no-break{page-break-inside:avoid}
}
#print .lh{display:flex;align-items:center;gap:14px;border-bottom:3px solid #F26522;padding-bottom:10px;margin-bottom:16px}
#print .lh img,#print .lh .lk{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #F26522}
#print .lh .lk{display:flex;align-items:center;justify-content:center;font:700 26px 'Barlow Condensed';color:#14224A}
#print .lh .ag{font:700 24pt/1 'Barlow Condensed';color:#14224A;letter-spacing:.5px}
#print .lh .sl{font-size:9pt;letter-spacing:2px;color:#F26522;font-weight:700;text-transform:uppercase}
#print .lh .co{margin-left:auto;text-align:right;font-size:9pt;color:#555;line-height:1.45}
#print h1{font:700 22pt 'Barlow Condensed';color:#14224A;margin:0 0 2px;letter-spacing:.4px}
#print .sub{color:#777;font-size:10pt;margin-bottom:14px}
#print h4{font:700 13pt 'Barlow Condensed';color:#14224A;border-bottom:1px solid #ddd;padding-bottom:3px;margin:16px 0 8px;letter-spacing:.3px;text-transform:uppercase}
#print table.kv td{padding:5px 8px;border:1px solid #e3e0da;font-size:10.5pt}
#print table.kv td:first-child{background:#F7F5F0;color:#666;width:34%;font-weight:600}
#print table.ls th{background:#14224A;color:#fff;font-size:8.5pt;padding:6px;border:0}
#print table.ls td{font-size:9.5pt;padding:5px 6px;border-bottom:1px solid #e3e0da}
#print table.ls tr:nth-child(even) td{background:#FAF8F4}
#print .sig{display:flex;gap:30px;margin-top:34px}
#print .sig div{flex:1;border-top:1px solid #999;padding-top:6px;font-size:9.5pt;color:#555;text-align:center}
#print .ft{margin-top:22px;border-top:1px solid #ddd;padding-top:6px;font-size:8.5pt;color:#888;display:flex;justify-content:space-between}
#print .prix{font:700 26pt 'JetBrains Mono',monospace;color:#F26522;margin:6px 0 10px}
#print .photo{width:100%;max-height:330px;object-fit:cover;border-radius:6px;margin-bottom:12px}
#print .cta{background:#14224A;color:#fff;border-radius:8px;padding:14px 16px;margin-top:16px}
#print .cta b{color:#F7A54A}
#print .kpis{display:flex;gap:10px;margin-bottom:6px}
#print .kpis div{flex:1;border:1px solid #e3e0da;border-top:3px solid #F26522;border-radius:5px;padding:8px}
#print .kpis small{display:block;font-size:7.5pt;color:#777;letter-spacing:1px;text-transform:uppercase}
#print .kpis b{font:700 18pt 'JetBrains Mono',monospace;color:#14224A}
</style>
</head>
<body>

<div id="lock" class="hide">
  <div class="bx">
    <img class="logo" id="lockLogo" alt="">
    <h2 style="margin:0 0 2px;color:var(--mar);font-size:22px">Clients &amp; Prospection</h2>
    <div style="color:var(--gy);font-size:12px;letter-spacing:2px;margin-bottom:16px" id="lockAg">KANJI MULTI SERVICES</div>
    <input id="pinIn" type="password" inputmode="numeric" maxlength="8" placeholder="Code">
    <div id="lockErr" style="color:var(--rg);font-size:13px;font-weight:600;margin-top:8px;display:none">Code incorrect</div>
    <button class="btn" style="width:100%;margin-top:14px;justify-content:center" onclick="unlock()">Ouvrir</button>
  </div>
</div>

<div class="bar">
  <img class="logo" id="barLogo" alt="">
  <div><div class="nom">CLIENTS &amp; PROSPECTION</div><div class="sous" id="barAg">KANJI MULTI SERVICES</div></div>
  <div class="sp"></div>
  <div class="sv"><div id="barAgent"></div><div id="svState">Enregistré ✓</div></div>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="wrap" id="view"></div>
<div id="modalHost"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

function load(){
  var raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw)return;
  try{var d=JSON.parse(raw);
    DB.clients=Array.isArray(d.clients)?d.clients:[];
    DB.biens=Array.isArray(d.biens)?d.biens:[];
    DB.modeles=Array.isArray(d.modeles)?d.modeles:[];
    DB.equipe=Array.isArray(d.equipe)?d.equipe:[];
    DB.settings=Object.assign(DB.settings,d.settings||{});
  }catch(e){ try{localStorage.setItem(KEY+"_corrompu",raw);}catch(_){ } DB._recup=true; }
}

/* ---------- outils ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._);t._=setTimeout(function(){t.classList.remove("on")},2600)}
function todayISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addDays(iso,n){var d=iso?new Date(iso+"T12:00:00"):new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function frDate(iso){if(!iso)return"—";var p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso}
function nowFr(){var d=new Date();return d.toLocaleDateString("fr-FR")+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function waNum(n){n=(n||"").replace(/[^0-9]/g,"");if(!n)return"";if(n.indexOf("225")===0)return n;if(n.length===10||n.length===8)return"225"+n;return n}
function waLink(num,msg){var n=waNum(num);return"https://wa.me/"+n+(msg?("?text="+encodeURIComponent(msg)):"")}
function telLink(n){return"tel:"+(n||"").replace(/[^0-9+]/g,"")}
function smsLink(n,msg){return"sms:"+(n||"").replace(/[^0-9+]/g,"")+"?body="+encodeURIComponent(msg||"")}
function mailLink(to,sub,body){return"mailto:"+encodeURIComponent(to||"")+"?subject="+encodeURIComponent(sub||"")+"&body="+encodeURIComponent(body||"")}
function S(){return DB.settings}
function logoSrc(){return S().logo||DEFAULT_LOGO}
function contactsLine(){var s=S(),a=[];if(s.tel)a.push("Tél : "+s.tel);if(s.wa)a.push("WhatsApp : "+s.wa);if(s.tel2)a.push(s.tel2);return a.join(" · ")}

/* ---------- TABLEAU DE BORD ---------- */
function stats(){
  var c=DB.clients,t=todayISO(),by={},src={};
  STATUTS.forEach(function(s){by[s]=0});
  c.forEach(function(x){by[x.statut]=(by[x.statut]||0)+1;var k=x.source||"Non renseignée";src[k]=(src[k]||0)+1});
  var mois=t.slice(0,7);
  return {total:c.length,by:by,src:src,due:c.filter(relanceDue),retard:c.filter(function(x){return relanceDue(x)&&x.relance<t}),
    // chaque compteur est indépendant : un client gagné ou perdu ne compte plus comme prospect / nouveau
    nouveaux:c.filter(function(x){return (x.dateAjout||"").slice(0,7)===mois&&x.statut!=="Client (gagné)"&&x.statut!=="Perdu"}).length,
    enCours:c.filter(function(x){return x.statut!=="Client (gagné)"&&x.statut!=="Perdu"}).length,
    dispo:DB.biens.filter(function(b){return (b.statut||"Disponible")==="Disponible"}).length};
}

    '<textarea id="sh_txt" style="min-height:170px" oninput="window._share.txt=this.value">'+esc(txt)+'</textarea>'
    +'<div class="sect">Envoyer à</div>'+mem,
    [printBtn,'<button class="btn o" onclick="copier($(\'#sh_txt\').value)">📋 Copier</button>',(navigator.share?'<button class="btn bl" onclick="navigator.share({title:window._share.titre,text:$(\'#sh_txt\').value}).catch(function(){})">↗️ Autre application</button>':'')]);
}
function exportPartage(){dl("KMS_Prospection_pour_collegue_"+todayISO()+".json",JSON.stringify({type:"kms_prospection",de:S().agent||"",date:todayISO(),clients:DB.clients,biens:DB.biens,modeles:DB.modeles},null,1),"application/json")}
function fusion(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result),nC=0,nB=0;
  function merge(arr,inc,cnt){(inc||[]).forEach(function(o){if(!o||!o.id)return;var i=arr.findIndex(function(x){return x.id===o.id});if(i<0){arr.push(o);cnt()}else if((o.maj||0)>(arr[i].maj||0)){arr[i]=o;cnt()}})}
  merge(DB.clients,d.clients,function(){nC++});merge(DB.biens,d.biens,function(){nB++});
  (d.modeles||[]).forEach(function(m){if(!DB.modeles.some(function(x){return x.titre===m.titre}))DB.modeles.push(m)});
  save();render();toast("✓ Fusion : "+nC+" client(s), "+nB+" bien(s) ajoutés ou mis à jour")}catch(e){toast("Fichier invalide")}};r.readAsText(f);inp.value=""}

/* ---------- PARAMÈTRES & SAUVEGARDE ---------- */
function vParams(){
  var s=S();
  var f=function(l,k,p,t){return '<div><label>'+l+'</label><input '+(t?'type="'+t+'" ':'')+'value="'+esc(s[k]||"")+'" placeholder="'+esc(p||"")+'" onchange="setP(\''+k+'\',this.value)"></div>'};
  $("#view").innerHTML=
    '<div class="carte"><h2>⚙️ Paramètres</h2><div class="st">Ces informations apparaissent sur les fiches imprimées, les images et les messages</div>'
    +'<div class="grid">'+f("Votre nom (utilisatrice)","agent","Ex. Awa Koné")+f("Nom de l'agence","agence")+f("Slogan","slogan")+'</div>'
    +'<div class="grid">'+f("Téléphone bureau","tel")+f("WhatsApp","wa")+f("Autre numéro","tel2")+f("Email de l'agence","email","contact@…","email")+'</div>'
    +'<div class="grid">'+f("Adresse","adresse")+f("Signature des documents","signature")+'<div><label>Relance automatique après</label><select onchange="setP(\'relanceJours\',this.value)">'+[3,7,14,30].map(function(n){return '<option value="'+n+'" '+(String(n)===String(s.relanceJours)?"selected":"")+'>'+n+' jours</option>'}).join("")+'</select></div></div>'
    +'<label>Logo</label><div class="row"><img src="'+logoSrc()+'" class="logo" style="width:56px;height:56px"><input type="file" accept="image/*" onchange="logoIn(this)" style="flex:1"><button class="btn o sm" onclick="setP(\'logo\',\'\');vParams()">Logo par défaut</button></div>'
    +'<label>Code d\'accès (vide = aucun)</label><input value="'+esc(s.pin)+'" placeholder="Ex. 1234" onchange="setP(\'pin\',this.value.trim());toast(\'Code mis à jour\')" style="max-width:220px"></div>'
    +'<div class="carte"><h2>💾 Sauvegarde</h2><div class="st">Vos données sont dans ce navigateur. Exportez une copie régulièrement (ex. chaque vendredi).</div>'
    +'<div class="row"><button class="btn" onclick="exportJSON()">⬇️ Sauvegarde complète (.json)</button><button class="btn bl" onclick="exportCSV()">⬇️ Clients (.csv Excel)</button></div>'
    +'<div class="sect">Restaurer / Importer</div>'
    +'<label>Restaurer une sauvegarde (.json) — remplace tout</label><input type="file" accept=".json" onchange="importJSON(this)">'
    +'<label>Importer des contacts (.csv — colonnes : nom, telephone, zone, type, notes)</label><input type="file" accept=".csv" onchange="importCSV(this)">'
    +'<div style="margin-top:12px;font-size:12px;color:var(--gy)">Espace utilisé : '+Math.round((JSON.stringify(DB).length)/1024)+' Ko (les photos prennent le plus de place).</div></div>'
    +'<div class="carte"><button class="btn rg" onclick="wipe()">🗑️ Tout effacer</button></div>';
}
function setP(k,v){DB.settings[k]=v;save();refreshBrand()}
function logoIn(inp){var f=inp.files[0];if(!f)return;reduireImage(f,300,.85,function(u){setP("logo",u);vParams();toast("✓ Logo mis à jour")})}
function dl(name,data,type){var b=new Blob([data],{type:type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);toast("✓ Exporté")}
function exportJSON(){var c=Object.assign({},DB);delete c._recup;dl("Sauvegarde_Prospection_KMS_"+todayISO()+".json",JSON.stringify(c,null,2),"application/json")}
function exportCSV(){var head=["nom","telephone","whatsapp","email","profession","zone","budget","type","bien","statut","source","priorite","conseiller","relance","visite","notes"];
  var rows=DB.clients.map(function(c){var b=bienById(c.bienId);return [c.nom,c.tel,c.whatsapp,c.email,c.profession,c.zone,c.budget,c.type,b?(b.ref||b.titre):"",c.statut,c.source,PRIO[c.priorite||"N"],c.conseiller,c.relance,c.visite,(c.notes||"").replace(/\n/g," ")].map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")});
  dl("Clients_KMS_"+todayISO()+".csv","﻿"+head.join(",")+"\n"+rows.join("\n"),"text/csv")}
function importJSON(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!confirm("Remplacer TOUTES les données actuelles par cette sauvegarde ?"))return;DB.clients=d.clients||[];DB.biens=d.biens||[];DB.modeles=d.modeles||[];if(d.equipe)DB.equipe=d.equipe;DB.settings=Object.assign(DB.settings,d.settings||{});save();render();toast("✓ Restauré")}catch(e){toast("Fichier invalide")}};r.readAsText(f);inp.value=""}
function importCSV(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{
  var lines=r.result.replace(/\r/g,"").replace(/^﻿/,"").split("\n").filter(function(l){return l.trim()});if(lines.length<2){toast("CSV vide");return;}
  var sep=lines[0].split(";").length>lines[0].split(",").length?";":",";
  var head=splitCSV(lines[0],sep).map(function(h){return h.toLowerCase().trim()});
  function col(row,names){for(var i=0;i<names.length;i++){var k=head.indexOf(names[i]);if(k>=0&&row[k])return row[k].trim()}return ""}
  var n=0;for(var i=1;i<lines.length;i++){var row=splitCSV(lines[i],sep),nom=col(row,["nom","name","client"]);if(!nom)continue;
    DB.clients.unshift({id:uid(),nom:nom,tel:col(row,["telephone","téléphone","tel","phone","contact","numero","numéro"]),whatsapp:col(row,["whatsapp","wa"]),email:col(row,["email","mail"]),zone:col(row,["zone","quartier","ville"]),budget:col(row,["budget"]),type:col(row,["type","besoin"]),statut:"Prospect",source:col(row,["source"]),priorite:"N",relance:"",notes:col(row,["notes","note","commentaire"]),dateAjout:todayISO(),historique:[],maj:Date.now()});n++}
  save();render();toast("✓ "+n+" contact(s) importé(s)")}catch(e){toast("Erreur CSV")}};r.readAsText(f);inp.value=""}
function splitCSV(line,sep){sep=sep||",";var o=[],c="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch=='"'){if(q&&line[i+1]=='"'){c+='"';i++}else q=!q}else if(ch==sep&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function wipe(){if(!confirm("Tout effacer ? Exportez une sauvegarde avant !"))return;if(!confirm("Confirmer la suppression de TOUT ?"))return;DB.clients=[];DB.biens=[];DB.modeles=[];save();render();toast("Effacé")}

/* ---------- IMPRESSION ---------- */
function entete(){var s=S();return '<div class="lh"><img src="'+logoSrc()+'" alt=""><div><div class="ag">'+esc(s.agence)+'</div><div class="sl">'+esc(s.slogan||"")+'</div></div>'
  +'<div class="co">'+esc(s.adresse||"")+'<br>'+esc(contactsLine())+(s.email?'<br>'+esc(s.email):'')+'</div></div>'}
function pied(){var s=S();return '<div class="ft"><span>'+esc(s.signature||s.agence)+'</span><span>Édité le '+nowFr()+(s.agent?' par '+esc(s.agent):'')+'</span></div>'}
function kv(rows){return '<table class="kv">'+rows.filter(function(r){return r[1]}).map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'}).join("")+'</table>'}
function imprimer(html){
  var p=$("#print");p.innerHTML=html;document.body.classList.add("printing");
  var fin=function(){document.body.classList.remove("printing");p.innerHTML="";window.removeEventListener("afterprint",fin)};
  window.addEventListener("afterprint",fin);
  var imgs=[].slice.call(p.querySelectorAll("img")),n=imgs.length,go=function(){setTimeout(function(){window.print()},150)};
  if(!n){go();return;}var k=0;imgs.forEach(function(i){if(i.complete){if(++k===n)go()}else{i.onload=i.onerror=function(){if(++k===n)go()}}});
}
function ficheClientHTML(c){
  var b=bienById(c.bienId);
  var h='<div class="pg">'+entete()+'<h1>Fiche client</h1><div class="sub">'+esc(c.nom)+' · ajouté le '+frDate(c.dateAjout)+'</div>'
    +'<h4>Identité</h4>'+kv([["Nom complet",c.nom],["Téléphone",c.tel],["WhatsApp",c.whatsapp],["Email",c.email],["Profession",c.profession]])
    +'<h4>Projet</h4>'+kv([["Type recherché",c.type],["Zone souhaitée",c.zone],["Budget",c.budget],["Bien d'intérêt",b&&((b.ref?b.ref+" — ":"")+b.titre+(b.prix?" ("+b.prix+")":""))]])
    +'<h4>Suivi commercial</h4>'+kv([["Statut",c.statut],["Priorité",PRIO[c.priorite||"N"]],["Source",c.source],["Conseiller(ère)",c.conseiller],["Prochaine relance",c.relance&&frDate(c.relance)],["Visite terrain",c.visite&&frDate(c.visite)]]);
  if(c.notes)h+='<h4>Notes</h4><div style="white-space:pre-wrap">'+esc(c.notes)+'</div>';
  var hs=c.historique||[];
  if(hs.length)h+='<h4>Historique des échanges</h4><table class="ls"><thead><tr><th style="width:90px">Date</th><th>Échange</th><th style="width:120px">Par</th></tr></thead><tbody>'+hs.slice().reverse().map(function(x){return '<tr><td>'+frDate(x.date)+'</td><td>'+esc(x.texte)+'</td><td>'+esc(x.par||"")+'</td></tr>'}).join("")+'</tbody></table>';
  h+='<div class="sig no-break"><div>Signature du client</div><div>Le/la conseiller(ère) KMS</div></div>'+pied()+'</div>';
  return h;
}
function printClient(id){var c=clientById(id);if(c)imprimer(ficheClientHTML(c))}
function ficheBienHTML(b){
  var s=S();
  return '<div class="pg">'+entete()+(b.photo?'<img class="photo" src="'+b.photo+'">':'')
    +'<div style="font:700 11pt JetBrains Mono,monospace;color:#F26522">'+esc(b.ref||"")+(b.type?' · '+esc(b.type.toUpperCase()):'')+'</div>'
    +'<h1>'+esc(b.titre)+'</h1>'+(b.prix?'<div class="prix">'+esc(b.prix)+'</div>':'')
    +'<h4>Caractéristiques</h4>'+kv([["Type",b.type],["Zone",b.zone],["Surface",b.surface],["Disponibilité",b.statut||"Disponible"],["Documents",(b.docs||[]).join(", ")],["Localisation",b.carte]])
    +(b.desc?'<h4>Description</h4><div style="white-space:pre-wrap">'+esc(b.desc)+'</div>':'')
    +'<div class="cta no-break"><b>Intéressé(e) ? Visite sur rendez-vous.</b><br>'+esc(contactsLine())+(s.email?' · '+esc(s.email):'')+'<br>'+esc(s.adresse||"")+'</div>'
    +pied()+'</div>';
}
function printBien(id){var b=bienById(id);if(b)imprimer(ficheBienHTML(b))}
function printCatalogue(){imprimer(DB.biens.map(ficheBienHTML).join(""))}
function tableClients(list){return '<table class="ls"><thead><tr><th>Nom</th><th>Téléphone</th><th>Zone</th><th>Type</th><th>Budget</th><th>Statut</th><th>Relance</th><th>Conseiller</th></tr></thead><tbody>'
  +list.map(function(c){return '<tr><td><b>'+esc(c.nom)+'</b></td><td>'+esc(c.tel||c.whatsapp||"")+'</td><td>'+esc(c.zone||"")+'</td><td>'+esc(c.type||"")+'</td><td>'+esc(c.budget||"")+'</td><td>'+esc(c.statut||"")+'</td><td>'+frDate(c.relance)+'</td><td>'+esc(c.conseiller||"")+'</td></tr>'}).join("")+'</tbody></table>'}
function printListe(){var list=clientsFiltres();var filt=[fS,fT,fC,fQ&&('« '+fQ+' »')].filter(Boolean).join(" · ");
  imprimer('<div class="pg">'+entete()+'<h1>Liste des clients</h1><div class="sub">'+list.length+' client(s)'+(filt?' · filtre : '+esc(filt):'')+'</div>'+tableClients(list)+pied()+'</div>')}
function printRelances(){var d=DB.clients.filter(relanceDue).sort(function(a,b){return a.relance.localeCompare(b.relance)});
  imprimer('<div class="pg">'+entete()+'<h1>Relances à faire</h1><div class="sub">Au '+frDate(todayISO())+' · '+d.length+' prospect(s)</div>'+(d.length?tableClients(d):'<p>Aucune relance en attente.</p>')+pied()+'</div>')}
function printRapport(){
  var st=stats();
  var h='<div class="pg">'+entete()+'<h1>Rapport de prospection</h1><div class="sub">Situation au '+nowFr()+'</div>'
    +'<div class="kpis"><div><small>Prospects en cours</small><b>'+st.enCours+'</b></div><div><small>Nouveaux prospects ce mois</small><b>'+st.nouveaux+'</b></div><div><small>Gagnés</small><b>'+(st.by["Client (gagné)"]||0)+'</b></div><div><small>Relances</small><b>'+st.due.length+'</b></div><div><small>Biens dispo</small><b>'+st.dispo+'</b></div></div>'
    +'<h4>Par statut</h4><table class="ls"><thead><tr><th>Statut</th><th style="width:80px">Nombre</th><th style="width:80px">%</th></tr></thead><tbody>'+STATUTS.map(function(s){var n=st.by[s]||0;return '<tr><td>'+s+'</td><td>'+n+'</td><td>'+(st.total?Math.round(n/st.total*100):0)+' %</td></tr>'}).join("")+'</tbody></table>'
    +'<h4>Par source</h4><table class="ls"><thead><tr><th>Source</th><th style="width:80px">Nombre</th></tr></thead><tbody>'+Object.keys(st.src).sort(function(a,b){return st.src[b]-st.src[a]}).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+st.src[k]+'</td></tr>'}).join("")+'</tbody></table>';
  var nego=DB.clients.filter(function(c){return c.statut==="En négociation"});
  if(nego.length)h+='<h4>En négociation</h4>'+tableClients(nego);
  if(st.retard.length)h+='<h4>Relances en retard</h4>'+tableClients(st.retard);
  h+=pied()+'</div>';
  imprimer(h);
}

}
function closeModal(){$("#modalHost").innerHTML=""}

/* ---------- LOCK ---------- */
function unlock(){var p=DB.settings.pin||"";if(!p||$("#pinIn").value===p){$("#lock").classList.add("hide")}else{$("#lockErr").style.display="block";$("#pinIn").value=""}}

  load();renderTabs();render();
  if(DB.settings.pin){var l=$("#lock");l.classList.remove("hide");$("#pinIn").focus();$("#pinIn").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()})}
